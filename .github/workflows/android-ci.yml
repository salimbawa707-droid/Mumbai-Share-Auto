name: Mumbai Share Auto Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firestore rules test dependencies
        run: npm install --prefix firestore-tests --no-package-lock --no-audit --no-fund

      - name: Run Firestore security rules emulator tests
        run: npx --yes firebase-tools@13.29.2 emulators:exec --only firestore --project demo-mumbai-share-auto "npm test --prefix firestore-tests"

      - name: Grant executable permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests and Android Lint
        run: ./gradlew clean testDebugUnitTest lintDebug --no-daemon

      - name: Prepare optional release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/mumbai-share-auto-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run Android instrumentation tests on API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Build release APK (verify R8 shrinking)
        run: ./gradlew assembleRelease --no-daemon


      - name: Upload Android build artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-share-auto-android-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
