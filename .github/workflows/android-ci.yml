name: Mumbai Share Auto Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android tests and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firestore rules test dependencies
        run: npm install --prefix firestore-tests --no-package-lock --no-audit --no-fund

      - name: Run Firestore security rules emulator tests
        run: npx --yes firebase-tools@13.29.2 emulators:exec --only firestore --project demo-mumbai-share-auto "npm test --prefix firestore-tests"

      - name: Grant executable permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Android unit tests and lint
        run: ./gradlew clean testDebugUnitTest lintDebug --no-daemon

      - name: Prepare optional release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/mumbai-share-auto-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Debug and R8 Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Android APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-share-auto-android-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/

  android-instrumentation:
    name: Android instrumentation tests on emulator
    # Ubuntu 22.04 is pinned for a stable Android Emulator / PackageManager host environment.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # GitHub-hosted runners lack KVM; use QEMU TCG with conservative graphics.
      ANDROID_I_WANT_MY_TCG: "yes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant executable permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Android instrumentation tests on API 34 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -partition-size 4096
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest --no-daemon
            TEST_STATUS=$?
            adb logcat -d -v threadtime > instrumentation-logcat.txt
            adb shell dumpsys activity processes > instrumentation-processes.txt
            exit "$TEST_STATUS"

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-share-auto-instrumentation-diagnostics
          if-no-files-found: warn
          path: |
            instrumentation-logcat.txt
            instrumentation-processes.txt
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
