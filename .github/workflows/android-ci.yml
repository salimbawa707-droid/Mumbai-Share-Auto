name: Mumbai Share Auto Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MumbaiShareAuto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant executable permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests and Android Lint
        run: ./gradlew clean testDebugUnitTest lintDebug --no-daemon

      - name: Compile instrumentation tests and debug APK
        run: ./gradlew compileDebugAndroidTestKotlin assembleDebug --no-daemon

      - name: Build release APK (verify R8 shrinking)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-share-auto-android-artifacts
          path: |
            MumbaiShareAuto/app/build/outputs/apk/
            MumbaiShareAuto/app/build/reports/
