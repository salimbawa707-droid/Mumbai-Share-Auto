name: Mumbai Share Auto Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant executable permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests and Android Lint
        run: ./gradlew clean testDebugUnitTest lintDebug --no-daemon

      - name: Compile instrumentation tests and debug APK
        run: ./gradlew compileDebugAndroidTestKotlin assembleDebug --no-daemon

      - name: Build release APK (verify R8 shrinking)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android build artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-share-auto-android-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
