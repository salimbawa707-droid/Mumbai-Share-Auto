name: PR4 safe main reconciliation

on:
  push:
    branches:
      - fix/p0-security-firestore-remediation

permissions:
  contents: write

jobs:
  reconcile:
    name: Three-way merge main into PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/p0-security-firestore-remediation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch current main
        run: git fetch origin main

      - name: Merge and resolve only reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          echo "PR branch: $(git rev-parse HEAD)"
          echo "main: $(git rev-parse origin/main)"

          if git merge --no-ff --no-edit origin/main; then
            echo "Merge completed without conflicts."
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Detected conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              ".github/workflows/android-ci.yml"
              "app/src/androidTest/java/com/mumbaishareauto/app/NavigationAndScreenTest.kt"
              "firestore-tests/security.rules.test.mjs"
              "firestore.rules"
            )
            actual="$(printf '%s\n' "${conflicts[@]}")"
            wanted="$(printf '%s\n' "${expected[@]}" | sort)"
            if [[ "$actual" != "$wanted" ]]; then
              echo "::error::Unexpected conflict set. Aborting without push."
              git merge --abort || true
              exit 1
            fi

            # Main contains the newer UI selectors, expanded security tests,
            # and post-state Firestore invariants. Keep those reviewed versions.
            git checkout --theirs -- app/src/androidTest/java/com/mumbaishareauto/app/NavigationAndScreenTest.kt
            git checkout --theirs -- firestore-tests/security.rules.test.mjs
            git checkout --theirs -- firestore.rules

            # Keep the PR's API 34 runner configuration for the stability trial,
            # then bring over the explicit Android-test compilation gates.
            git checkout --ours -- .github/workflows/android-ci.yml
            python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/android-ci.yml")
          s = p.read_text()
          if "api-level: 34" not in s:
              raise SystemExit("Expected PR API 34 emulator configuration is missing")
          if "api-level: 35" in s:
              raise SystemExit("Unexpected API 35 emulator configuration")
          build_anchor = "      - name: Prepare optional release signing key"
          build_step = (
              "      - name: Compile Android instrumentation test APK\n"
              "        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon\n\n"
          )
          if "Compile Android instrumentation test APK" not in s:
              if build_anchor not in s:
                  raise SystemExit("Cannot locate Android build insertion point")
              s = s.replace(build_anchor, build_step + build_anchor, 1)
          emulator_anchor = "      - name: Run Android instrumentation tests on API 34 emulator"
          emulator_step = (
              "      - name: Fail fast if instrumentation tests fail to compile\n"
              "        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon\n\n"
          )
          if "Fail fast if instrumentation tests fail to compile" not in s:
              if emulator_anchor not in s:
                  raise SystemExit("Cannot locate API 34 emulator insertion point")
              s = s.replace(emulator_anchor, emulator_step + emulator_anchor, 1)
          p.write_text(s)
          PY
            git add .github/workflows/android-ci.yml
            git add app/src/androidTest/java/com/mumbaishareauto/app/NavigationAndScreenTest.kt
            git add firestore-tests/security.rules.test.mjs firestore.rules
            git commit --no-edit

          fi

          git log -1 --oneline
          git status --short

      - name: Push merge commit without force
        run: git push origin HEAD:refs/heads/fix/p0-security-firestore-remediation
