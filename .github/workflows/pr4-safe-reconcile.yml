name: PR #4 safe main reconciliation

on:
  push:
    branches:
      - fix/p0-security-firestore-remediation

permissions:
  contents: write

jobs:
  reconcile:
    name: Three-way merge main into PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/p0-security-firestore-remediation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch current main
        run: git fetch origin main

      - name: Perform non-destructive three-way merge
        shell: bash
        run: |
          set -euo pipefail
          echo "PR branch before merge: $(git rev-parse HEAD)"
          echo "main fetched for merge: $(git rev-parse origin/main)"
          if git merge --no-ff --no-edit origin/main; then
            echo "Merge completed without conflicts."
            git log -1 --oneline
          else
            echo "::error::Automatic three-way merge has conflicts. No branch update will be pushed."
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
            exit 1
          fi

      - name: Push merge commit without force
        run: git push origin HEAD:refs/heads/fix/p0-security-firestore-remediation
